<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rossé · Administrar catálogo</title>
<style>
*{box-sizing:border-box}body{margin:auto;max-width:840px;background:#fff8fa;color:#462237;padding:20px;font:16px/1.5 system-ui}header{background:#8a1f4b;color:white;border-radius:26px;padding:14px 24px;display:flex;align-items:center;gap:18px}header strong{font:italic 34px Georgia}h1,h2{font-family:Georgia}input,select,button{font:inherit;border:1px solid #cda8b7;border-radius:12px;padding:10px;background:white;color:inherit}input:not([type=checkbox]),select{width:100%}[hidden]{display:none!important}label{display:block;margin:12px 0}button{cursor:pointer}button.primary{background:#8a1f4b;color:white}button:disabled{opacity:.5}#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}#list button{text-align:left}img{display:block;object-fit:cover;border-radius:10px}#list img{width:100%;height:120px;margin-bottom:8px}.row{background:white;padding:12px;margin:10px 0;border-radius:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}.row img{width:68px;height:80px}.row label{margin:0}.preview{width:min(100%,290px);height:270px;object-fit:contain}dialog{border:0;border-radius:20px;max-width:90vw}dialog::backdrop{background:#40132c88}#msg{font-weight:600}button:focus-visible,input:focus-visible{outline:3px solid #c23d6b}
</style><header><strong>Rossé</strong> Catálogo de la tienda</header><p><a href="/" style="color:#8a1f4b">‹ Inicio del panel</a></p><p id="msg" role="status"></p>
<section id="browse"><h1>Mis productos</h1><button id="add" class="primary">Agregar producto</button><label>Buscar producto<input id="search" type="search" placeholder="Nombre o categoría"></label><div id="list"></div></section>
<section id="edit" hidden><button id="back">‹ Mis productos</button><h1 id="name"></h1><label>Nombre del producto<input id="productName" maxlength="120" required></label>
<label id="categoryLabel">Categoría<select id="category"><option value="desayunos">Desayunos</option><option value="anchetas">Anchetas</option><option value="flores">Flores</option><option value="cajas">Cajas</option><option value="peluches">Peluches</option></select></label><label>Precio en pesos colombianos<input id="price" type="number" min="1" max="999999999" placeholder="Consultar precio"></label><label>Precio de oferta en pesos colombianos<input id="offer" type="number" min="1" max="999999999" placeholder="Sin oferta"></label><p id="discount"></p>
<label>Qué incluye · un elemento por línea<textarea id="includes" rows="6" style="width:100%;font:inherit;padding:10px;border:1px solid #cda8b7;border-radius:12px"></textarea></label><h2>Fotos del producto</h2><label>Subir fotos a este producto<input id="files" type="file" accept="image/*" multiple></label><div id="photos"></div><p id="sheet"></p><button id="review" class="primary">Vista previa</button> <button id="deleteProduct">Retirar producto</button></section>
<dialog id="preview"><h2 id="previewName"></h2><img class="preview" id="cover" alt="Portada"><p id="summary"></p><button id="close">Seguir editando</button> <button id="publish" class="primary">Publicar cambios</button></dialog>
<script>
const $=id=>document.getElementById(id),store="https://rossetienda.online/";
let catalog=[],draft=null,busy=false,dirty=false;
async function api(path,opts){const response=await fetch(path,opts);if(!response.ok)throw Error((await response.json().catch(()=>null))||"No pudimos completar el cambio.");return response.json()}
function el(tag,text){const node=document.createElement(tag);if(text)node.textContent=text;return node}
function image(src,alt){const img=el("img");img.src=new URL(src,store);img.alt=alt;return img}
function action(label,fn){const b=el("button",label);b.onclick=fn;return b}
function message(t){$("msg").textContent=t}
function listing(){const term=$("search").value.toLocaleLowerCase();$("list").replaceChildren(...catalog.filter(p=>(p.name+" "+p.category).toLocaleLowerCase().includes(term)).map(p=>{const b=action(p.name,()=>openProduct(p));b.prepend(image(p.photos[0],""));return b}))}
function openProduct(p){draft=structuredClone(p);dirty=false;$("browse").hidden=true;$("edit").hidden=false;$("name").textContent=p.name||"Nuevo producto";$("productName").value=p.name;$("category").value=p.category;$("categoryLabel").hidden=Boolean(p.id);$("deleteProduct").hidden=!p.id;$("price").value=p.price??"";$("offer").value=p.offer??"";$("includes").value=(p.includes??[]).join("\n");showDiscount();message("");draw()}
function draw(){$("sheet").textContent=draft.sheet?"La ficha del catálogo aparece al final del carrusel.":"";$("photos").replaceChildren(...draft.photos.map((src,i)=>{const row=el("div");row.className="row";row.append(image(src,"Foto "+(i+1)),el("strong",i===0?"Portada":"Foto "+(i+1)));const move=(to)=>{draft.photos.splice(i,1);draft.photos.splice(to,0,src);dirty=true;draw()};if(i)row.append(action("Hacer portada",()=>move(0)),action("Subir",()=>move(i-1)));if(i<draft.photos.length-1)row.append(action("Bajar",()=>move(i+1)));const label=el("label"),check=el("input");check.type="checkbox";check.checked=draft.gallery.includes(src);check.onchange=()=>{dirty=true;draft.gallery=draft.gallery.filter(x=>x!==src);if(check.checked)draft.gallery.push(src)};label.append(check," Mostrar en galería");row.append(label);return row}))}
function lock(value){busy=value;for(const k of ["back","review","files","publish","close","deleteProduct","productName","category","price","offer","includes"])$(k).disabled=value}
function showDiscount(){
 const price=Number($("price").value),offer=Number($("offer").value);
 $("discount").textContent=offer>0&&offer<price?"Descuento · "+Math.floor((price-offer)*100/price)+"%":"";
}
for(const id of ["productName","category","price","offer","includes"])$(id).oninput=()=>{dirty=true;showDiscount()};
$("add").onclick=()=>openProduct({name:"",category:"desayunos",price:null,offer:null,includes:[],photos:[],gallery:[],revision:0});
$("deleteProduct").onclick=async()=>{
 if(!confirm("¿Retirar "+draft.name+" de la tienda?"))return;
 lock(true);
 try{
  await api("/products/"+draft.id,{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({revision:draft.revision})});
  catalog=catalog.filter(p=>p.id!==draft.id);dirty=false;$("back").click();$("edit").hidden=true;$("browse").hidden=false;listing();message("Producto retirado de la tienda.");
 }catch(error){message(error.message)}finally{lock(false)}
};
$("back").onclick=()=>{if(dirty&&!confirm("¿Salir sin publicar los cambios?"))return;$("edit").hidden=true;$("browse").hidden=false;dirty=false;message("");listing()};
$("search").oninput=listing;
$("files").onchange=async()=>{const selected=[...$("files").files];lock(true);try{for(const [i,file] of selected.entries()){message("Preparando foto "+(i+1)+" de "+selected.length+"…");const bitmap=await createImageBitmap(file);const scale=Math.min(1,1800/Math.max(bitmap.width,bitmap.height));const canvas=el("canvas");canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const blob=await new Promise(r=>canvas.toBlob(r,"image/webp",.86));if(!blob||blob.type!=="image/webp")throw Error("Este navegador no pudo convertir la imagen.");const src=await api("/photos",{method:"POST",body:blob});draft.photos.push(src);dirty=true;draw()}message("Fotos listas para revisar.")}catch(e){message(e.message)}finally{$("files").value="";lock(false)}};
$("review").onclick=()=>{for(const id of ["productName","price","offer"])if(!$(id).reportValidity())return;
draft.name=$("productName").value.trim();draft.category=$("category").value;draft.includes=$("includes").value.split("\n").map(x=>x.trim()).filter(Boolean);
draft.price=$("price").value===""?null:Number($("price").value);draft.offer=$("offer").value===""?null:Number($("offer").value);
if(!draft.name||!draft.photos.length){message("Escribe un nombre y agrega al menos una foto.");return}
if(draft.offer!==null && draft.offer>=draft.price){message("El precio de oferta debe ser menor al precio normal.");return}$("previewName").textContent=draft.name;$("cover").src=new URL(draft.photos[0],store);$("summary").textContent=(draft.price===null?"Consultar precio":"$"+draft.price.toLocaleString("es-CO")+" COP")+(draft.offer?" → $"+draft.offer.toLocaleString("es-CO")+" COP · "+$("discount").textContent:"")+" · "+draft.photos.length+" fotos · "+draft.gallery.length+" en galería";$("preview").showModal()};
$("close").onclick=()=>$("preview").close();
$("publish").onclick=async()=>{lock(true);try{const updated=await api(draft.id?"/products/"+draft.id:"/products",{method:draft.id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(draft)});catalog=[...catalog.filter(p=>p.id!==updated.id),updated];openProduct(updated);message("Cambios publicados.")}catch(e){message(e.message)}finally{$("preview").close();lock(false)}};
api("/products").then(p=>{catalog=p;listing()}).catch(e=>message(e.message));
</script></html>
