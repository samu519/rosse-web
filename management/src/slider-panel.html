<!doctype html><html lang="es-CO"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rossé · Portada principal</title>
<style>
*{box-sizing:border-box}body{max-width:850px;margin:auto;padding:24px;background:#fff8fa;color:#462237;font:16px/1.5 system-ui}header{background:#8a1f4b;color:white;padding:18px 24px;border-radius:24px}header strong{font:italic 32px Georgia}h1{font:normal 40px Georgia}a{color:#8a1f4b}button,select,input{font:inherit}button,select{border:1px solid #cda8b7;border-radius:12px;padding:10px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.primary{background:#8a1f4b;color:white;border:0;padding:14px 24px}.slot{display:grid;grid-template-columns:24px 64px minmax(0,1fr) auto auto;gap:8px;align-items:center;background:white;border:1px solid #ebcad8;border-radius:16px;padding:10px;margin:10px 0}.slot img{width:64px;height:70px;object-fit:cover;border-radius:8px}.slot select{width:100%;min-width:0}.settings{padding:20px;background:white;border-radius:16px;margin:18px 0;display:grid;gap:12px}#status{min-height:24px;font-weight:600}button:focus-visible,select:focus-visible{outline:3px solid #c23d6b}@media(max-width:480px){body{padding:14px}.slot{grid-template-columns:20px 44px minmax(0,1fr) auto auto;gap:4px;padding:6px}.slot img{width:44px;height:55px}.slot button{padding:7px}.slot select{padding:7px}}
</style><header><strong>Rossé</strong> · Portada principal</header><p><a href="/">‹ Inicio del panel</a></p><h1>Tu portada, tus regalos.</h1><p>Elige ocho productos y organízalos en el orden que quieras mostrar en la tienda.</p><div id="slots"></div><div class="settings"><label><input type="checkbox" id="auto" checked> Reproducción automática</label><label>Tiempo por producto: <select id="seconds"></select></label></div><button class="primary" id="save" disabled>Publicar portada</button> <a href="https://rossetienda.online/" target="_blank" rel="noopener">Ver tienda ↗</a><p id="status" role="status"></p>
<script>
const $=id=>document.getElementById(id), store='https://rossetienda.online';let config,catalog=[],busy=false;
const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
for(let i=3;i<=15;i++){const o=el('option',i+' segundos');o.value=i;$('seconds').append(o)}
async function api(opts){const r=await fetch('/slider/settings',opts);const d=await r.json();if(!r.ok)throw Error(typeof d==='string'?d:'No se pudo guardar');return d}
function draw(){const root=$('slots');root.replaceChildren();config.ids.forEach((id,i)=>{const row=el('div');row.className='slot';const img=el('img');const p=catalog.find(p=>p.id===id);if(p){img.src=store+p.image;img.alt=p.name}const sel=el('select');sel.setAttribute('aria-label','Producto '+(i+1));for(const p of catalog){const o=el('option',p.name+' · '+p.category);o.value=p.id;o.disabled=p.id!==id&&config.ids.includes(p.id);sel.append(o)}sel.value=id;sel.onchange=()=>{config.ids[i]=sel.value;draw()};const up=el('button','↑'),down=el('button','↓');up.setAttribute('aria-label','Subir producto');down.setAttribute('aria-label','Bajar producto');up.disabled=i===0||busy;down.disabled=i===config.ids.length-1||busy;sel.disabled=busy;function move(j){[config.ids[i],config.ids[j]]=[config.ids[j],config.ids[i]];draw()}up.onclick=()=>move(i-1);down.onclick=()=>move(i+1);row.append(el('span',String(i+1)),img,sel,up,down);root.append(row)});$('save').disabled=busy; $('auto').disabled=busy;$('seconds').disabled=busy}
async function load(){try{config=await api();catalog=config.catalog;$('auto').checked=config.autoplay;$('seconds').value=config.seconds;draw()}catch(e){$('status').textContent=e.message}}
$('save').onclick=async()=>{busy=true;draw();$('status').textContent='Publicando…';try{const d=await api({method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:config.ids,seconds:Number($('seconds').value),autoplay:$('auto').checked,revision:config.revision})});config.revision=d.revision;$('status').textContent='Portada publicada correctamente.'}catch(e){$('status').textContent=e.message}finally{busy=false;draw()}};load();
</script></html>
