<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rossé · Administración</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #fff8fa; color: #462237; font: 1rem/1.55 system-ui, sans-serif }
    main { max-width: 770px; padding: clamp(24px, 7vw, 70px) 24px; margin: auto }
    .brand { font: italic 2.4rem Georgia, serif; color: #8a1f4b; text-decoration: none }
    h1 { font: normal clamp(2.65rem, 7vw, 4.7rem)/1 Georgia, serif; margin: 32px 0 18px }
    .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; margin-top: 34px }
    .choices a { display: grid; gap: 8px; padding: 24px; border: 1px solid #ebcad8; border-radius: 22px; background: white; color: inherit; text-decoration: none }
    .choices a:hover, .choices a:focus-visible { background: #fde9ef; border-color: #8a1f4b }
    .choices strong { color: #8a1f4b; font-size: 1.2rem }
  table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.65rem;border-bottom:1px solid #ebcad8;overflow-wrap:anywhere}.scroll{overflow:auto}</style>
</head>
<body><main><a href="/">← Rossé Admin</a><h1>Celebraciones</h1>
<p id="status" role="status">Cargando la agenda…</p>
<section hidden id="agenda"><h2>Próximas celebraciones</h2><div class="scroll"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Celebración</th><th>Ocasión</th></tr></thead><tbody></tbody></table></div></section>
<script>
async function loadAgenda() {
  const status = document.querySelector("#status");
  try {
    const response = await fetch("/celebraciones/agenda", {cache:"no-store"});
    if (!response.ok) throw new Error("No se pudo cargar la agenda. Revisa la conexión con registro-usuarios.");
    const {clientes, momentos} = await response.json();
    const today = Date.parse(new Intl.DateTimeFormat("sv-SE", {timeZone:"America/Bogota"}).format(new Date()) + "T00:00:00Z");
    const year = new Date(today).getUTCFullYear();
    function nextDate(moment) {
      const [y,m,d] = moment.fecha.split("-").map(Number);
      const original = Date.UTC(y,m-1,d);
      if (!Number(moment.es_anual) || original >= today) return original;
      const dateIn = y => Date.UTC(y,m-1,Math.min(d,new Date(Date.UTC(y,m,0)).getUTCDate()));
      return dateIn(year) >= today ? dateIn(year) : dateIn(year+1);
    }
    const upcoming = momentos.map(m => ({...m, next:nextDate(m)})).filter(m => m.next >= today).sort((a,b) => a.next-b.next);
    const week = upcoming.filter(m => m.next < today + 7*86400000).length;
    status.textContent = clientes + " clientes · " + momentos.length + " celebraciones guardadas · " + week + " en los próximos 7 días.";
    if (!upcoming.length) {status.textContent += " Sin próximas celebraciones."; return;}
    const dates = new Intl.DateTimeFormat("es-CO",{timeZone:"UTC",dateStyle:"medium"});
    const rows = document.querySelector("tbody");
    for (const m of upcoming) {
      const row = rows.insertRow();
      for (const value of [dates.format(m.next), [m.nombre,m.apellido].join(" "), m.titulo, m.tipo]) row.insertCell().textContent = value;
    }
    document.querySelector("#agenda").hidden = false;
  } catch(error) {status.textContent = error.message;}
}
loadAgenda();
</script></main></body></html>
